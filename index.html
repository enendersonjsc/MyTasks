<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTasks - Lista de Tarefas</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-list-check logo-icon"></i>
                <h2>MyTasks</h2>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" id="nav-all-tasks">
                    <i class="fa-solid fa-globe"></i>
                    <span>Todas as Tarefas</span>
                    <span class="badge" id="badge-all">0</span>
                </button>
                <button class="nav-item" id="nav-inbox">
                    <i class="fa-solid fa-inbox"></i>
                    <span>Caixa de Entrada</span>
                    <span class="badge" id="badge-inbox">0</span>
                </button>
            </nav>

            <div class="projects-section">
                <div class="projects-header">
                    <span>PROJETOS</span>
                    <button id="btn-add-project" title="Criar Projeto"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="projects-list" id="projects-tree">
                    <!-- Árvore de projetos renderizada dinamicamente -->
                </ul>
            </div>

            <!-- Widget Histórico Compacto (7 Dias) -->
            <div class="history-widget">
                <div class="history-header">
                    <span><i class="fa-solid fa-clock-rotate-left"></i> Histórico (7 dias)</span>
                    <span class="history-count" id="history-counter">0</span>
                </div>
                <ul class="history-list" id="history-list">
                    <!-- Itens concluídos nos últimos 7 dias -->
                </ul>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Pomodoro Bar Header -->
            <header class="top-bar">
                <div class="pomodoro-widget">
                    <div class="pomodoro-status">
                        <span id="pomo-mode">Foco</span>
                        <span id="pomo-timer">25:00</span>
                    </div>
                    <div class="pomodoro-controls">
                        <button id="pomo-start-btn" class="btn-pomo"><i class="fa-solid fa-play"></i></button>
                        <button id="pomo-reset-btn" class="btn-pomo"><i class="fa-solid fa-rotate-right"></i></button>
                        <select id="pomo-sound-select" class="pomo-sound-picker">
                            <option value="beep">Beep</option>
                            <option value="alarm">Alarme Duplo</option>
                            <option value="zen">Zen</option>
                            <option value="mute">Mudo</option>
                        </select>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <section class="content-header">
                <div class="title-area">
                    <h1 id="current-view-title">Todas as Tarefas</h1>
                    <span class="subtitle" id="current-view-subtitle">Visão Consolidada</span>
                </div>
                <div class="header-actions">
                    <button id="btn-clear-completed" class="btn-secondary" title="Ocultar concluídas da lista mantendo no histórico de 7 dias">
                        <i class="fa-solid fa-broom"></i> Limpar Concluídas
                    </button>
                </div>
            </section>

            <!-- Task Input Form -->
            <form id="add-task-form" class="task-form">
                <input type="text" id="task-input-text" placeholder="Adicionar nova tarefa..." required>
                <input type="date" id="task-input-date" title="Data Limite (Opcional)">
                <select id="task-input-priority" required>
                    <option value="high">🔴 Alta</option>
                    <option value="medium" selected>🟡 Média</option>
                    <option value="low">🟢 Baixa</option>
                </select>
                <button type="submit" class="btn-primary"><i class="fa-solid fa-plus"></i> Adicionar</button>
            </form>

            <!-- Task List -->
            <div class="tasks-container">
                <ul id="tasks-list" class="tasks-list">
                    <!-- Tarefas renderizadas dinamicamente -->
                </ul>
            </div>
        </main>
    </div>

    <!-- Modal Editar Tarefa -->
    <div class="modal" id="modal-edit-task">
        <div class="modal-content">
            <h3>Editar Tarefa</h3>
            <input type="text" id="edit-task-text" placeholder="Nome da tarefa">
            <label for="edit-task-date">Data limite:</label>
            <input type="date" id="edit-task-date">
            <label for="edit-task-priority">Prioridade:</label>
            <select id="edit-task-priority">
                <option value="high">🔴 Alta</option>
                <option value="medium">🟡 Média</option>
                <option value="low">🟢 Baixa</option>
            </select>
            <div class="modal-actions">
                <button id="btn-cancel-edit" class="btn-secondary">Cancelar</button>
                <button id="btn-save-edit" class="btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
