<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTasks — Gerenciador de Tarefas</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>⚡ MyTasks</h2>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-item active" id="nav-inbox" onclick="switchContext('inbox')">
                    <span class="nav-icon">📥</span>
                    <span class="nav-title">Caixa de Entrada</span>
                    <span class="badge" id="badge-inbox">0</span>
                </div>

                <div class="nav-item" id="nav-all" onclick="switchContext('all')">
                    <span class="nav-icon">🌐</span>
                    <span class="nav-title">Todas as Tarefas</span>
                    <span class="badge" id="badge-all">0</span>
                </div>

                <div class="projects-section">
                    <div class="projects-header">
                        <span>Projetos</span>
                        <button class="btn-icon" onclick="openProjectModal()" title="Novo Projeto">+</button>
                    </div>
                    <div class="projects-tree" id="projects-tree">
                        <!-- Árvore de projetos gerada dinamicamente -->
                    </div>
                </div>
            </nav>

            <!-- Widget Pomodoro Integrado -->
            <div class="pomodoro-widget">
                <div class="pomodoro-header">
                    <span id="pomo-mode-title">⏱️ Pomodoro</span>
                    <select id="pomo-sound" title="Sons de Alarme" onchange="savePomoSettings()">
                        <option value="beep">Beep</option>
                        <option value="double-alarm">Alarme Duplo</option>
                        <option value="zen">Zen</option>
                        <option value="mute">Mudo</option>
                    </select>
                </div>
                <div class="pomodoro-timer" id="pomo-display">25:00</div>
                <div class="pomodoro-controls">
                    <button id="pomo-start-btn" onclick="togglePomodoro()">Iniciar</button>
                    <button onclick="resetPomodoro()">Reset</button>
                </div>
                <div class="pomodoro-modes">
                    <button onclick="setPomoMode('focus')" class="mode-btn active" id="mode-focus">Foco</button>
                    <button onclick="setPomoMode('short')" class="mode-btn" id="mode-short">Pausa</button>
                    <button onclick="setPomoMode('long')" class="mode-btn" id="mode-long">Longa</button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-title-group">
                    <h1 id="current-context-title">📥 Caixa de Entrada</h1>
                    <span class="subtitle" id="current-context-subtitle">Gerencie suas tarefas pendentes</span>
                </div>
                <div class="header-actions">
                    <button class="btn-secondary" onclick="clearCompletedTasks()">🧹 Limpar Concluídas</button>
                    <button class="btn-secondary" onclick="toggleHistoryModal()">📜 Histórico (7d)</button>
                </div>
            </header>

            <!-- Task Input Box -->
            <div class="task-input-container">
                <form id="task-form" onsubmit="handleAddTask(event)">
                    <div class="input-row">
                        <input type="text" id="task-text" placeholder="O que precisa ser feito?" required autocomplete="off">
                        <select id="task-priority" title="Prioridade">
                            <option value="low">🟢 Baixa</option>
                            <option value="medium" selected>🟡 Média</option>
                            <option value="high">🔴 Alta</option>
                        </select>
                        <input type="date" id="task-due-date" title="Data Limite">
                        <button type="submit" class="btn-primary">Adicionar</button>
                    </div>
                </form>
            </div>

            <!-- Task Lists -->
            <div class="tasks-container">
                <div class="task-list" id="active-tasks-list">
                    <!-- Tarefas ativas renderizadas dinamicamente -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Criar/Editar Projetos -->
    <div class="modal" id="project-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="project-modal-title">Novo Projeto</h3>
                <button class="btn-close" onclick="closeProjectModal()">&times;</button>
            </div>
            <form id="project-form" onsubmit="handleSaveProject(event)">
                <input type="hidden" id="project-edit-id">
                <input type="hidden" id="project-parent-id">
                
                <div class="form-group">
                    <label for="project-name">Nome do Projeto:</label>
                    <input type="text" id="project-name" placeholder="Ex: Estudos, Trabalho..." required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="project-color">Cor do Projeto:</label>
                    <div class="color-picker-row">
                        <input type="color" id="project-color" value="#3b82f6">
                        <span id="project-color-hex">#3b82f6</span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeProjectModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Edição Completa de Tarefa -->
    <div class="modal" id="task-edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Tarefa</h3>
                <button class="btn-close" onclick="closeTaskEditModal()">&times;</button>
            </div>
            <form id="task-edit-form" onsubmit="handleSaveTaskEdit(event)">
                <input type="hidden" id="edit-task-id">
                
                <div class="form-group">
                    <label for="edit-task-text">Descrição da Tarefa:</label>
                    <input type="text" id="edit-task-text" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="edit-task-priority">Prioridade:</label>
                    <select id="edit-task-priority">
                        <option value="low">🟢 Baixa</option>
                        <option value="medium">🟡 Média</option>
                        <option value="high">🔴 Alta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="edit-task-due-date">Data Limite de Entrega:</label>
                    <input type="date" id="edit-task-due-date">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeTaskEditModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Histórico de Tarefas (7 Dias) -->
    <div class="modal" id="history-modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>📜 Histórico de Tarefas Concluídas (Últimos 7 dias)</h3>
                <button class="btn-close" onclick="toggleHistoryModal()">&times;</button>
            </div>
            <div class="history-list" id="history-tasks-list">
                <!-- Tarefas em histórico renderizadas dinamicamente -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
