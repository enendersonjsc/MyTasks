<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTasks - Gerenciador de Projetos e Tarefas</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>MyTasks</h2>
                <button id="btn-new-project" class="btn-icon" title="Novo Projeto">+</button>
            </div>

            <nav class="projects-nav">
                <!-- Categoria Padrão -->
                <div class="nav-item active" data-type="inbox">
                    <span class="icon">📥</span>
                    <span>Caixa de Entrada</span>
                </div>

                <!-- Lista Dinâmica de Projetos/Subprojetos -->
                <div id="projects-list"></div>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="main-content">
            <!-- BLOCO DO POMODORO -->
            <section class="pomodoro-section">
                <div class="timer-display" id="timer">25:00</div>
                <div class="pomodoro-controls">
                    <button id="start-btn">Iniciar</button>
                    <button id="pause-btn" disabled>Pausar</button>
                    <button id="reset-btn">Resetar</button>
                </div>
                <div class="audio-settings">
                    <label>Foco: 
                        <select id="sound-focus">
                            <option value="double-alarm" selected>Alarme Duplo</option>
                            <option value="beep">Beep Rápido</option>
                            <option value="zen">Gongo Zen</option>
                            <option value="silent">Silencioso</option>
                        </select>
                    </label>
                    <label>Pausa: 
                        <select id="sound-break">
                            <option value="beep" selected>Beep Rápido</option>
                            <option value="double-alarm">Alarme Duplo</option>
                            <option value="zen">Gongo Zen</option>
                            <option value="silent">Silencioso</option>
                        </select>
                    </label>
                </div>
            </section>

            <!-- CABEÇALHO DO CONTEXTO ATUAL -->
            <header class="context-header">
                <h1 id="current-context-title">📥 Caixa de Entrada</h1>
            </header>

            <!-- FORMULÁRIO DE CRIAR TAREFA -->
            <section class="task-form-section">
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="O que precisa ser feito?" required>
                    <select id="task-priority">
                        <option value="baixa">Baixa</option>
                        <option value="media" selected>Média</option>
                        <option value="alta">Alta</option>
                    </select>
                    <button type="submit">Adicionar</button>
                </form>
            </section>

            <!-- LISTA DE TAREFAS -->
            <section class="tasks-section">
                <ul id="tasks-list"></ul>
            </section>
        </main>
    </div>

    <!-- MODAL DE CRIAR PROJETO -->
    <div id="project-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Novo Projeto</h3>
            <input type="text" id="project-name-input" placeholder="Nome do Projeto">
            <label for="project-color-input">Cor do Projeto:</label>
            <input type="color" id="project-color-input" value="#3498db">
            <div class="modal-actions">
                <button id="btn-cancel-project">Cancelar</button>
                <button id="btn-save-project">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
