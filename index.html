<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTasks - Gerenciador de Tarefas</title>
    <!-- FIX FAVICON -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Produtividade</h2>
        
        <div class="nav-item active" data-type="inbox">
            📥 Caixa de Entrada
        </div>

        <div class="projects-header">
            <span>Projetos</span>
            <button class="btn-add-main" id="btn-new-project" title="Criar Projeto Principal">+</button>
        </div>

        <div class="projects-tree" id="projects-tree">
            <!-- Projetos e Subprojetos injetados via JS -->
        </div>

        <!-- PAINEL GLOBAL DE CONCLUÍDAS (ÚLTIMOS 7 DIAS) -->
        <div class="history-panel">
            <div class="history-header">
                <span>✓ Concluídas (7 dias)</span>
                <span class="history-count" id="history-count">0</span>
            </div>
            <ul class="history-list" id="history-list">
                <!-- Injetado via JS -->
            </ul>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
        <!-- BARRA SUPERIOR -->
        <header class="header-bar">
            <h1 class="context-title" id="current-context-title">📥 Caixa de Entrada</h1>

            <!-- POMODORO WIDGET -->
            <div class="pomodoro-card">
                <div class="timer-display" id="timer">25:00</div>
                <button class="pomo-btn" id="start-btn">Iniciar</button>
                <button class="pomo-btn" id="pause-btn" disabled>Pausar</button>
                <button class="pomo-btn" id="reset-btn">Reset</button>

                <div class="pomo-selects">
                    <select id="sound-focus" title="Som Foco">
                        <option value="double-alarm">Alarme</option>
                        <option value="beep">Beep</option>
                        <option value="zen">Zen</option>
                        <option value="silent">Mudo</option>
                    </select>
                    <select id="sound-break" title="Som Pausa">
                        <option value="beep">Beep</option>
                        <option value="double-alarm">Alarme</option>
                        <option value="zen">Zen</option>
                        <option value="silent">Mudo</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- FORMULÁRIO DE TAREFAS -->
        <form class="task-form" id="task-form">
            <input type="text" class="task-input" id="task-input" placeholder="Adicionar nova tarefa..." required>
            <select id="task-priority">
                <option value="low">Baixa</option>
                <option value="medium" selected>Média</option>
                <option value="high">Alta</option>
            </select>
            <button type="submit" class="btn-submit">Adicionar</button>
        </form>

        <!-- LISTA DE TAREFAS -->
        <ul class="tasks-list" id="tasks-list">
            <!-- Tarefas injetadas via JS -->
        </ul>
    </main>

    <!-- MODAL DE NOVO PROJETO/SUBPROJETO -->
    <div class="modal hidden" id="project-modal">
        <div class="modal-content">
            <h3 id="modal-title">Novo Projeto</h3>
            <input type="text" id="project-name-input" placeholder="Nome do projeto..." required>
            <label style="color: #888; font-size: 0.85rem;">Cor do Projeto:</label>
            <input type="color" id="project-color-input" value="#3498db" style="width: 100%; height: 35px; cursor: pointer;">
            
            <div class="modal-actions">
                <button class="pomo-btn" style="background-color: #555;" id="btn-cancel-project">Cancelar</button>
                <button class="btn-submit" id="btn-save-project">Salvar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDIÇÃO DE TAREFA -->
    <div class="modal hidden" id="edit-task-modal">
        <div class="modal-content">
            <h3>Editar Tarefa</h3>
            <input type="text" id="edit-task-text-input" placeholder="Texto da tarefa..." required>
            <label style="color: #888; font-size: 0.85rem;">Prioridade:</label>
            <select id="edit-task-priority-input">
                <option value="low">Baixa</option>
                <option value="medium">Média</option>
                <option value="high">Alta</option>
            </select>
            
            <div class="modal-actions">
                <button class="pomo-btn" style="background-color: #555;" id="btn-cancel-task-edit">Cancelar</button>
                <button class="btn-submit" id="btn-save-task-edit">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
